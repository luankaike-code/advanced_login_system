[project]
name = "basic-login-system"
version = "0.1.0"
description = ""
authors = [
    {name = "Luan Kaike",email = "luankaikemacksantos@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mysql-connector-python (>=26.7.0,<27.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

[tool.poetry]
packages = [
	{include = "bls_db", from = "src"},
	{include = "bls_api", from = "src"},
	{include = "bls_client", from = "src"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
